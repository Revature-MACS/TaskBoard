spring.application.name=TaskBoard


# SQLite DataSource configuration
spring.datasource.url=jdbc:sqlite:./demo-db.sqlite
spring.datasource.driver-class-name=org.sqlite.JDBC

# Hibernate dialect for SQLite (from hibernate-community-dialects)
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect

# Options: none | validate | update | create | create-drop
# Using custom schema query since hibernate does not play nice with SQLite
spring.jpa.hibernate.ddl-auto=create-drop

# Show SQL for debugging
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.jpa.properties.hibernate.type.preferred_uuid_jdbc_type=CHAR
